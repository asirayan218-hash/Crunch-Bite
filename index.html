<!doctype html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .card
        {
            width:250px;
            background-color:white;
            margin:15px;
            text-align:center;
            border:2px solid black;
            padding:8px;
            border-radius:15px;
            cursor:pointer;
            transition: transform 0.3s ease;
        }
        .card:hover
        {
       transform: translateY(-8px);
        box-shadow:0px 8px 20px rgba(0,0,0,0.06);
        }
        
        .container
        {
            display:flex;
            gap:10px;
            justify-content:center;
            flex-wrap:wrap;
        }
        h2
        {
            font-size:18px;
        }
            
        .logo
        {
            text-align:center;
            font-family: sans-serif;
            font-size:28px;
            margin:20px;
            color:#111;
            }
            body
            {
              font-family: 'poppins',sans-serif;
              background-color:#f4f7f6;
            }
            .grid
            {
                display:grid;
                grid-template-coloumns: repeat(auto-fit, minmax(250px, 1fr))>
            }
        }
        
        button
        {
            background:linear-gradient(135deg,#0984e3, #6c5ce7);
            color:white;
            padding:10px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-weight:600;
        }
    </style>
    </head>
    <body>
        <h1 class="logo"> shopping land</h1>
        <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" width="100%">
            <h2>Bata shoes</h2>
            <p>30% sale</p>
            <button>Buy now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" width="100%">
            <h2>Smart watch</h2>
            <p>25% off</p>
            <button>Buy Now</button>
            </div>
            <div class="card">
             <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300" width="100%">
             <h2>All types laptop</h2>
             <p>30% off</p>
             <button>Buy Now</button>
            </div>
            <div class="card">
            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=300" width="100%">
             <h2> All types sunglasses</h2>
             <p>40% sale</p>
             <button>Buy Now</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=300" width="100%">
                <h2>Branded T-shirts</h2>
                <p>17% sale</p>
                <button>Buy Now</button>
            </div>
        <div class="card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300"width="100%">
             <h2>wireless headphone</h2>
             <p>50$</p>
             <button>Buy Now</button>
             </div>
        </div>
    </body>
    </html>
