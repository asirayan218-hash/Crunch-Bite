<!doctype html>
<html>
<head>
    <style>
        .card
        {
            width:250px;
            margin:15px;
            text-align:center;
            border:2px solid black;
            padding:8px;
            border-radius:12px;
            cursor:pointer;
            transition:0.3s;
        }
        .card:hover
        {
       transform: translateY(-8px);
        box-shadow:0px 8px 15px rgba(0,0,0,0.2);
        }
        
        .container
        {
            display:flex;
            gap:10px;
            justify-content:center;
            flex-wrap:wrap;
        }
        h2
        {
            font-size:18px;
        }
            
        .logo
        {
            text-align:center;
            font-family: sans-serif;
            font-size:28px;
            margin:20px;
            color:#111;
            }
        }
        
        button
        {
            background-color:black;
            color:white;
            padding:8px 15px;
            border-radius:5px;
            border:none;
        }
    </style>
    </head>
    <body>
        <h1 class="logo"> shopping land</h1>
        <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" width="100%">
            <h2>Bata shoes</h2>

            <button>Buy now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" width="100%">
            <h2>Smart watch</h2>
            <p>25% off</p>
            <button>Buy Now</button>
            </div>
            <div class="card">
             <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300" width="100%">
             <h2>All types laptop</h2>

            </div>
            <div class="card">

             <h2> All types sunglasses</h2>
             <p>40% sale</p>
             <button>Buy Now</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=300" width="100%">
                <h2>Branded T-shirts</h2>

        <div class="card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300"width="100%">
             <h2>wireless headphone</h2>
             <p>50$</p>

             </div>
        </div>
    </body>
    </html>
